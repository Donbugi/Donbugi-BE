spring:
  application:
    name: finEdu

  # 기본 in-memory 유저(랜덤 비밀번호) 비활성화 — JWT만 사용
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # 데이터소스 (PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finedu}
    driver-class-name: org.postgresql.Driver

  # Flyway: 운영 DB(기존 스키마)는 baseline 0 으로 등록 후 V1.. 적용.
  # 마이그레이션은 IF EXISTS / IF NOT EXISTS 로 작성해 빈 DB 에서도 안전하다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  # JPA
  # NOTE: 운영 스키마 dump 로 V0 baseline 을 만든 뒤 validate 로 전환 예정 (docs/API_CHANGES.md 참고)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

# Actuator: 관리 포트를 분리(기본 8081)해 외부 노출 없이 헬스체크·Prometheus 스크랩
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: finEdu

# Swagger UI (springdoc-openapi): http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 삼성증권 일간이슈 — POST /api/issue-schedule/import 로 월 1회 수집
issue-calendar:
  samsung-origin: https://www.samsungpop.com
  list-path: /ux/kor/invest/issue/dayDataList.do
  connect-timeout-ms: 15000
  read-timeout-ms: 30000
  max-rows-per-day: 500
  between-day-delay-ms: 400

# 코스피 (네이버 금융 스크랩 → Redis 캐시, 분 단위 갱신에 맞춤)
kospi:
  naver-url: https://finance.naver.com/sise/sise_index.naver?code=KOSPI
  redis-key: market:kospi:now
  cache-ttl-seconds: 60
  connect-timeout-ms: 10000

# 경제 날씨 (KOSPI + S&P500 + USD 환율 → 일별 Redis 캐시)
# KOREAEXIM_AUTH_KEY: 수출입은행 Open API 인증키 (로컬은 application-local.yml 또는 환경변수)
economic-weather:
  kospi-api-url: https://m.stock.naver.com/api/index/KOSPI/basic
  sp500-naver-api-url: https://polling.finance.naver.com/api/realtime/worldstock/stock/SPY
  sp500-api-url: https://query2.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=5d&interval=1d
  sp500-fallback-stooq-url: https://stooq.com/q/l/?s=^spx&f=sd2t2ohlcv&h&e=csv
  exchange-api-base-url: https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON
  koreaexim-auth-key: ${KOREAEXIM_AUTH_KEY:}
  sp500-redis-key: market:sp500:now
  sp500-stale-redis-key: market:sp500:last
  sp500-cache-ttl-seconds: 3600
  redis-key-prefix: "market:economic-weather:"
  cache-ttl-seconds: 1800
  connect-timeout-ms: 10000
  read-timeout-ms: 15000

# 모의투자 (Mock Trading) — 20종목, 초기 1000만원
mock-trading:
  naver-stock-api-url: https://m.stock.naver.com/api/stock/{code}/basic
  naver-polling-api-url: https://polling.finance.naver.com/api/realtime/domestic/stock/{code}
  redis-key-prefix: "market:stock:"
  price-cache-ttl-seconds: 300
  price-refresh-ms: 300000
  pending-check-ms: 300000
  market-close-cron: "0 30 15 * * MON-FRI"
  connect-timeout-ms: 10000
  read-timeout-ms: 15000

# 최근 한 달 관심 뉴스(카테고리별 조회 수 Redis + AI 한마디)
news:
  interest:
    redis-prefix: "finEdu:news:interest:"
    timezone: Asia/Seoul
    month-key-ttl-days: 400
    insight-cache-ttl-minutes: 30
    # 예: http://localhost:8000/news/interest-insight  (POST JSON { "topics": [...] } → { "insight": "..." })
    ai-insight-url: ${FIN_EDU_AI_INSIGHT_URL:http://127.0.0.1:8000/news/interest-insight}
    ai-connect-timeout-ms: 5000
    ai-read-timeout-ms: 45000

# 퀴즈
quiz:
  ai-server-url: ${FIN_EDU_AI_QUIZ_URL:http://127.0.0.1:8000/quiz}
  cache-ttl-days: 7
  lock-ttl-seconds: 30
  ai-connect-timeout-ms: 5000
  ai-read-timeout-ms: 60000
  # 과제 정답률·오답노트 (전부 Redis, DB 미사용)
  stats:
    redis-prefix: "finEdu:quiz:stats:"
    timezone: Asia/Seoul
    day-key-ttl-days: 120
    month-key-ttl-days: 800
    wrong-retention-days: 60

# 크롤러
crawler:
  delay-min: 1500
  delay-max: 3000
  categories:
    - name: 금융
      url: "https://news.naver.com/breakingnews/section/101/259"
    - name: 증권
      url: "https://news.naver.com/breakingnews/section/101/258"
    - name: 산업
      url: "https://news.naver.com/breakingnews/section/101/261"
    - name: 부동산
      url: "https://news.naver.com/breakingnews/section/101/260"
    - name: 글로벌경제
      url: "https://news.naver.com/breakingnews/section/101/262"
    - name: 생활경제
      url: "https://news.naver.com/breakingnews/section/101/310"

# JWT: APP_AUTH_JWT_SECRET 필수(32바이트 이상). local/test 프로필에서만 미설정 시 임시 랜덤 키로 기동
app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://127.0.0.1:3000
      - http://127.0.0.1:5173
      - https://donbugi.site
      - http://donbugi.site
      - https://donbugi.xyz
      - https://www.donbugi.xyz
      - http://donbugi.xyz
      - https://donbugife.vercel.app
  auth:
    jwt:
      secret: ${APP_AUTH_JWT_SECRET:}
      expiration-hours: 720

# 포인트 교환(메일 안내) — 첫 계정 생성 시 지급 포인트, 발신 주소
# spring.mail.host 등을 설정하면 교환 완료 후 JavaMail로 발송합니다. 미설정 시 본문은 로그로만 출력됩니다.
  points:
    timezone: Asia/Seoul
    demo-initial-balance: 10000
    mail-from: "nniij88@gmail.com"
    qr-delivery-days-hint: 3
    # 최근 적립·사용 3건 캐시 (키: {prefix}{userId}, 값: JSON 배열)
    activity-redis-key-prefix: "finEdu:points:activity:"
    activity-cache-ttl-hours: 168